# Each badge:
#   DISPLAY:      MiniMessage shown next to the name (keep it short, 1-2 characters).
#   NAME:         Name in the menu and messages.
#   DESCRIPTION:  Menu lore lines.
#   ICON:         Menu item material.
#   REQUIREMENTS: All must be met to unlock the badge. Leave empty for staff-only badges (/badges give).
#     TYPE: WINS, RANKED_WINS, KILLS, ELO, EXPERIENCE, BEST_WIN_STREAK, BEST_KILL_STREAK, MATCHES_PLAYED,
#           DAYS_SINCE_JOIN, EVENT_WINS, FFA_KILLS, DIVISION, LEADERBOARD_TOP
#     AMOUNT: target number (for LEADERBOARD_TOP: the top N positions)
#     LADDER: optional ladder name (WINS, RANKED_WINS, KILLS, BEST_WIN_STREAK, BEST_KILL_STREAK, LEADERBOARD_TOP); required for ELO
#     DIVISION: division name for DIVISION, e.g. "Gold I"
#     STAT: leaderboard for LEADERBOARD_TOP: ELO, WINS, KILLS, DEATHS, WIN_STREAK, BEST_WIN_STREAK, LOSE_STREAK, BEST_LOSE_STREAK
#   Once unlocked, a badge is kept even if the requirement is no longer met.
BADGES:
