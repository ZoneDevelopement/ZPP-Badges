PREFIX: "<dark_gray>[<gold>Badges<dark_gray>] "
NO-PERMISSION: "<red>You don't have permission to do this."
PLAYER-ONLY: "<red>Only players can use this command."
PLAYER-NOT-FOUND: "<red>Player <white><player></white> is not online."
BADGE-NOT-FOUND: "<red>No badge with the id <white><badge></white>."
UNLOCKED: "<green>You unlocked the <badge_name> <green>badge! <gray>Equip it in <white>/badges</white>."
ACTIVATED: "<green>Equipped <badge_name><green>."
DEACTIVATED: "<yellow>Unequipped <badge_name><yellow>."
MAX-REACHED: "<red>You can equip at most <white><max></white> badges."
CLEARED: "<yellow>Unequipped all badges."
LOCKED: "<red>You haven't unlocked this badge yet."
ADMIN:
  GIVEN: "<green>Gave <badge_name> <green>to <white><player></white>."
  ALREADY-UNLOCKED: "<red><player> already has that badge."
  TAKEN: "<yellow>Took <badge_name> <yellow>from <white><player></white>."
  NOT-UNLOCKED: "<red><player> doesn't have that badge."
  RESET: "<yellow>Reset all badges of <white><player></white>."
  RELOADED: "<green>Badges config reloaded."
  LIST: "<gray><player> has <white><count>/<total></white> badges: <badges>"
  USAGE:
    - "<gold>/badges <gray>- open the badges menu"
    - "<gold>/badges give <player> <badge> <gray>- unlock a badge"
    - "<gold>/badges take <player> <badge> <gray>- remove a badge"
    - "<gold>/badges reset <player> <gray>- remove all badges"
    - "<gold>/badges list <player> <gray>- list unlocked badges"
    - "<gold>/badges reload <gray>- reload the config"
GUI:
  UNLOCKED-LORE:
    - ""
    - "<green>Unlocked"
    - "<yellow>Click to equip"
  ACTIVE-LORE:
    - ""
    - "<green>Equipped <gray>(slot <white><slot></white>)"
    - "<yellow>Click to unequip"
  LOCKED-LORE-HEADER:
    - ""
    - "<red>Locked"
  ADMIN-ONLY-LORE:
    - "<gray>Given by staff only."
  PREVIOUS-PAGE: "<yellow>Previous page"
  NEXT-PAGE: "<yellow>Next page"
  BACK: "<red>Back to cosmetics"
  CLEAR: "<red>Unequip all"
  INFO-NAME: "<gold>Your badges"
  INFO-LORE:
    - "<gray>Unlocked: <white><unlocked>/<total>"
    - "<gray>Equipped: <white><active>/<max>"
    - "<gray>Preview: <preview>"
REQUIREMENT:
  DONE: "<green>✔ <requirement>"
  PROGRESS: "<red>✘ <requirement> <dark_gray>(<current>/<target>)"
  LADDER-SUFFIX: " <gray>on <white><ladder>"
  WINS: "<gray>Win <white><target></white> matches<ladder_suffix>"
  RANKED-WINS: "<gray>Win <white><target></white> ranked matches<ladder_suffix>"
  KILLS: "<gray>Get <white><target></white> kills<ladder_suffix>"
  ELO: "<gray>Reach <white><target></white> elo<ladder_suffix>"
  EXPERIENCE: "<gray>Reach <white><target></white> experience"
  BEST-WIN-STREAK: "<gray>Reach a <white><target></white> win streak<ladder_suffix>"
  BEST-KILL-STREAK: "<gray>Reach a <white><target></white> FFA kill streak<ladder_suffix>"
  MATCHES-PLAYED: "<gray>Play <white><target></white> matches"
  DAYS-SINCE-JOIN: "<gray>Play on the server for <white><target></white> days"
  EVENT-WINS: "<gray>Win <white><target></white> events"
  FFA-KILLS: "<gray>Get <white><target></white> FFA kills"
  DIVISION: "<gray>Reach the <division> <gray>division"
  LEADERBOARD-TOP: "<gray>Be top <white><target></white> on the <white><stat></white> leaderboard<ladder_suffix>"
  LEADERBOARD-POSITION: "#<position>"
  LEADERBOARD-UNRANKED: "unranked"
