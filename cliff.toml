[changelog]
header = """
# Changelog

All notable changes to ZPP-Badges.\n
"""
body = """
{%- if version %}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{%- for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.breaking %} **[BREAKING]**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/ZoneDevelopement/ZPP-Badges/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^Merge", skip = true },
    { body = ".*BREAKING CHANGE.*", group = "<!-- 0 -->🚨 Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->✨ New Features" },
    { message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
    { message = "^(refactor|perf)", group = "<!-- 3 -->🚀 Improvements" },
    { message = "^docs\\(changelog\\)", skip = true },
    { message = "^docs", group = "<!-- 4 -->📖 Documentation" },
    { message = "^(build|ci)", group = "<!-- 5 -->🔧 Build" },
    { message = ".*", group = "<!-- 6 -->🧩 Other Changes" },
]
